[project]
name = "eklabs"
version = "0.1.0"
description = "AI CTD authoring & cross-validation platform"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.2",
    "pydantic>=2.8.2",
    # Runtime dependency, not just a scripts/ tool: products/ectd/profiles
    # loads authority profile YAML at request time (format_policy.py).
    "pyyaml>=6.0.2",
    # Loads .env in every real process entry point (conftest.py,
    # migrations/env.py, apps/api/worker.py) — .gitignore already carved
    # out .env/.env.* (keeping !.env.example), this just actually wires it up.
    "python-dotenv>=1.0.1",
    # Ingestion pipeline (platform/ingestion/) --------------------------
    # docling/docling-core and langfuse are pinned EXACT, not >=, deviating
    # from this project's usual convention: ingestion/parsing.py,
    # ingestion/chunking.py and llm/tracing.py were written against these
    # exact versions' actual source (field names/signatures moved enough
    # between versions during development to break code written against
    # the docs alone) — bumping either needs a re-check of those files
    # against the new version's source, not just a version-string edit.
    "docling==2.133.0",
    "docling-core==2.99.0",
    "pandas>=2.2.0",  # Excel/CSV straight into table_extract rows
    "openpyxl>=3.1.0",
    "boto3>=1.34.0",  # Supabase Storage's S3-compatible endpoint
    "arq>=0.26.0",
    "redis>=5.0.0",
    # Embeddings (platform/knowledge/) -----------------------------------
    "sentence-transformers>=3.0.0",  # BGE-large-en-v1.5, self-hosted
    # Claude gateway (platform/llm/) -------------------------------------
    "anthropic>=0.40.0",
    "langfuse==4.17.0",  # v3+ restructured the SDK (no more langfuse.decorators)
    # Citation checks (platform/evidence/) -------------------------------
    "rapidfuzz>=3.9.0",  # near-exact quote matching
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.3",
    "mypy>=1.11.1",
    "types-PyYAML>=6.0.12",
]
sourcing = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# session-scoped, not the pytest-asyncio default of function-scoped: the
# AsyncEngine in eklabs_platform.core.db.session is a module-level singleton
# (matching production, where it lives for the app process's whole life, one
# event loop). asyncpg connections are bound to the event loop that opened
# them — a function-scoped loop closes at the end of every test, so the next
# test's pool_pre_ping tries to reuse a connection tied to an already-closed
# loop and fails with "RuntimeError: Event loop is closed". Session-scoping
# the test loop matches the engine's actual (session-long) lifetime.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["src/eklabs_platform", "src/products"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# boto3/botocore ship no inline type stubs (types-boto3 is a huge,
# separately-maintained stub package not worth the dependency for the two
# calls storage.py actually makes).
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# docling_core's own internals import DoclingDocument/TableItem/DocChunk
# this same way (confirmed by reading hybrid_chunker.py's source) — these
# are the package's real public import paths, just not re-declared via
# __all__, which --strict's implicit-reexport check doesn't know.
module = ["docling_core.*"]
implicit_reexport = true

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["eklabs_platform*", "products*"]
