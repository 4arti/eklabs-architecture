[project]
name = "eklabs"
version = "0.1.0"
description = "AI CTD authoring & cross-validation platform"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.1",
    "pgvector>=0.3.2",
    "pydantic>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.3",
    "mypy>=1.11.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/eklabs_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# asyncpg ships no type stubs / py.typed marker; only used for its exception
# classes in tests (isinstance checks against a raised DBAPIError.orig).
module = "asyncpg.*"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["eklabs_platform*", "products*"]
