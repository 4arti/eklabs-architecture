# Postgres is Supabase (cloud) — not here. Neo4j isn't needed until the
# knowledge-graph phase. For now this covers only what Arq's background
# jobs need: Redis.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
